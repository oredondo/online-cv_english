career-profile:
    title: Career Profile
    summary: |
        Senior Infrastructure & Platform Engineer with 10+ years of experience building automation-first
        internal platforms in Python — systems that eliminate manual processes, connect teams, and let
        organisations scale without adding headcount. I don't just build systems — I conceive, design,
        and own them end-to-end, from architecture decisions to production reliability.

        My work at BBVA has been defined by building internal platforms that shift how the organisation
        operates: replacing manual processes with automation, eliminating team bottlenecks by making underlying
        infrastructure effectively invisible to end users through self-service abstractions, designing the
        database models and managing high-volume data operations (massive query execution across tens of thousands
        of assets and automated audit data pipelines consumed by compliance stakeholders), and exploring AI-driven
        operational diagnostics through **Orion AI** — a functional agentic PoC (LangGraph/ReAct) developed to automate
        failure triage, currently awaiting alignment on central AI platform infrastructure before wider adoption.

        I believe in designing systems that are **simple to use but powerful underneath** — where infrastructure
        and data complexity are made completely invisible behind clean abstractions (like declarative YAML blueprints
        in our **automation suite**, agentic workflow graphs, driver patterns, agnostic pipelines) so that engineers
        across the organisation can move faster and with zero friction.

        Currently serving **500+ engineers** daily across a platform that processes **40,000+ operations/day**
        across **30,000+ machines**. Seeking Senior Platform Engineering, Infrastructure, SRE, or Systems Architect roles.
    summary_short: |
        Senior Infrastructure & Platform Engineer with 10+ years of experience in Python, DevOps, and
        automation. Owner and sole architect of BBVA's internal IaaS platform suite (Orion & automation suite) —
        managing database modeling, massive query execution, and audit data pipelines across **30,000+ machines**
        and **40,000+ daily operations** for **500+ engineers**.

        Specialised in building governance-driven self-service platforms, database management, audit data pipelines,
        and declarative tooling; developed the **Orion AI** agentic diagnostic PoC (LangGraph/ReAct), ready to integrate
        with shared AI infrastructure. Seeking Senior Platform, Infrastructure, SRE, or Systems Integration roles.





