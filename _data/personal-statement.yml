title: "Personal Statement"

paragraphs:
  - "I am a Senior Platform Engineer and Senior Python Developer with over 10 years of experience. I don't just build pipelines; I design internal developer platforms that hide infrastructure complexity behind clean, versioned abstractions. My core engineering philosophy is to pave **'Golden Paths'**—self-service models that eliminate manual bottlenecks, reduce cognitive load for developers, and ensure security and compliance are built in by design, rather than enforced as an afterthought."

  - "My work at BBVA Technology has been defined by designing systems that are cloud-agnostic, open-source-first, and highly resilient. As the sole architect of **Orion** (the central governance and deployment platform) and **Blueprint** (an asynchronous, declarative YAML lifecycle engine conceptually similar to Terraform), I created custom abstractions and driver patterns that eliminated the need for proprietary suites like Red Hat Automation Platform. This has enabled 500+ engineers to orchestrate parallel provisioning and job execution across hybrid environments (AWS, OpenStack, on-premises) from a single source of truth, without vendor lock-in."

  - "A key part of my engineering approach is identifying architectural bottlenecks and replacing them with tailored, high-availability systems. When Jenkins limited our scalability and reliability, I designed a custom high-availability execution dispatcher using Django and Celery. I decoupled variable management from execution playbooks, ensuring configuration is resolved dynamically at runtime. This reduced configuration drift, eliminated vendor constraints, and now processes 40,000+ operations daily with complete auditability."

  - "Looking forward, I believe the next major evolution in software and platform engineering is the pragmatic integration of applied AI and agentic systems into developer tooling and living environments. Having architected **Orion AI** (LangGraph/ReAct) for production CI/CD auto-diagnostics at BBVA, and built personal multimodal systems like **OmniLecture Studio** (LangGraph with local faster-whisper speech recognition on Linux), I focus on building reliable, privacy-first agents grounded in typed tools, strict schemas, and human-in-the-loop validation rather than brittle prompts."

  - "Beyond system architecture, I believe technical leadership is about defining high standards of engineering and growing the team around me. I actively invest in mentorship, running pair programming sessions, and helping junior engineers find their footing. I thrive in collaborative, international environments—such as leading the integration of our platform stack across engineering teams in Mexico and Turkey—where accountability, continuous learning, and clean, test-driven code are at the heart of daily operations."
