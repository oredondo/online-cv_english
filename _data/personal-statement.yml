title: "Personal Statement"

paragraphs:
  - "I am a Senior Platform Engineer and SRE with over 10 years of experience. I don't just build pipelines; I design internal developer platforms that hide infrastructure complexity behind clean, versioned abstractions. My core engineering philosophy is to pave **'Golden Paths'**—self-service models that eliminate manual bottlenecks, reduce cognitive load for developers, and ensure security and compliance are built in by design, rather than enforced as an afterthought."

  - "My work at BBVA Technology has been defined by designing systems that are cloud-agnostic and highly resilient. As the sole architect of **Orion** (the central governance and deployment platform) and **navi_blueprint** (an asynchronous, declarative lifecycle engine conceptually similar to Terraform), I have leveraged custom abstractions, Pulumi, Kubernetes, and driver-based patterns. This has enabled 500+ engineers to orchestrate parallel provisioning and job execution across hybrid environments (AWS, OpenStack, on-premises) from a single source of truth, without vendor lock-in."

  - "A key part of my engineering approach is identifying architectural bottlenecks and replacing them with tailored, high-availability systems. When Jenkins limited our scalability and reliability, I designed a custom high-availability execution dispatcher using Django and Celery. I decoupled variable management from execution playbooks, ensuring configuration is resolved dynamically at runtime. This reduced configuration drift, eliminated vendor constraints, and now processes 40,000+ operations daily with complete auditability."

  - "Looking forward, I believe the next major evolution in Platform Engineering is the integration of AI-driven tools directly into the developer experience. By building conversational interfaces and autonomous agents (a philosophy I explored in personal projects like **WrenchBuddy** using LangChain and vLLM), we can empower developers to query infrastructure status, diagnose deployment errors, and trigger auto-remediation using natural language, making internal platforms even more intuitive and resilient."

  - "Beyond system architecture, I believe technical leadership is about defining high standards of engineering and growing the team around me. I actively invest in mentorship, running pair programming sessions, and helping junior engineers find their footing. I thrive in collaborative, international environments—such as leading the integration of our platform stack across engineering teams in Mexico and Turkey—where accountability, continuous learning, and clean, test-driven code are at the heart of daily operations."
