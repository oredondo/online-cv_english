career-profile:
    title: Career Profile
    summary: |
        Senior Software Engineer and Platform Architect with 10+ years of experience at the intersection of
        Python/Django development, DevOps, and Site Reliability Engineering. I don't just build systems —
        I conceive, design, and own them end-to-end, from architecture decisions to production reliability.

        My work at BBVA has been defined by building internal platforms that shift how the organisation
        operates: replacing manual processes with automation, eliminating team bottlenecks through
        self-service models, and bringing order to complex multi-environment infrastructure through
        strong governance, full auditability, and environment-agnostic tooling.

        I believe in designing systems that are **simple to use but powerful underneath** — where the
        complexity is hidden behind clean abstractions (driver patterns, agnostic pipelines, centralised
        configuration) so that engineers across the organisation can move faster and with fewer errors.

        Currently serving **500+ engineers** daily across a platform that processes **35,000+ operations/day**
        across **25,000+ machines**. Seeking senior Python, SRE, or DevOps roles — open to remote.
    summary_short: |
        Senior Software Engineer and Platform Architect with 10+ years of experience in Python/Django,
        DevOps, and SRE. Owner and sole architect of BBVA's internal IaaS platform suite — serving
        **500+ engineers** daily, processing **35,000+ operations/day** across **25,000+ machines**.
        Specialised in building governance-driven, self-service infrastructure platforms with full
        auditability and environment-agnostic tooling. Open to remote senior roles.


