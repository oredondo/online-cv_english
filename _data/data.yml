experiences:
    title: Experiences
    info:
      - role: Senior Python Developer, DevOps — IaaS Platform Owner
        time: 2017 - Present
        company: BBVA Technology, Madrid
        details: |
          Owner and sole architect of BBVA's internal IaaS & operational AI platform suite (Orion, Orion AI & automation suite) — critical systems that today
          form the backbone of infrastructure operations across the entire organisation, serving 500+
          engineers and processing 40,000+ daily operations across 30,000+ machines.
          Led all technical decisions end-to-end: system architecture, API design, database modeling and schema management across MongoDB and PostgreSQL, massive query execution, async processing, deployment strategy, and long-term evolution of the platform — making underlying multi-environment infrastructure effectively invisible to platform users while preserving 100% auditability.
          Conceived, designed, and developed **Orion AI** as a validated PoC for FONIL — an agentic operational AI system (LangGraph, ReAct, Qwen LLM) to automate CI/CD failure diagnostics and log triage; prototype tested and prepared, pending integration guidelines for central AI infrastructure.
          Conceived, designed, and built our **automation suite** (Blueprint) as a declarative, asynchronous Python orchestration engine using custom YAML blueprints (conceptually similar to Terraform), enabling teams to manage the full infrastructure lifecycle and eliminating the need for commercial suites like Red Hat Automation Platform.
          Defined a **deployment philosophy and engineering standards** adopted organisation-wide,
          establishing how infrastructure is provisioned, audited, and governed across all environments.
          Collaborated with multiple internal teams and stakeholders to identify operational bottlenecks
          and translate them into scalable, automated technical solutions.
          Managed production incidents and on-call responsibilities at banking scale, ensuring high
          availability and rapid resolution with minimal business impact.
          Mentored new team members and ran internal knowledge-sharing sessions across teams, fostering
          a common engineering culture around infrastructure automation and platform best practices.
          Managed the technical integration of our platform stack across international teams in Mexico and Turkey — running onboarding sessions, providing cross-team support, and developing specific platform enhancements to streamline their integration.
        details_short: |
          Owner and sole architect of BBVA's IaaS platform suite (Orion & automation suite) — leading database modeling, massive query management, and making infrastructure invisible to 500+ engineers across 30,000+ machines.

          Developed the Orion AI PoC (LangGraph/ReAct) for automated CI/CD diagnostics, ready for integration with shared AI infrastructure.
          Designed Blueprint as an asynchronous YAML orchestration engine, avoiding proprietary vendor lock-in (Red Hat Automation Platform).
          Led platform architecture, API design, and organization-wide deployment standards.
          Managed the integration and onboarding of international teams in Mexico and Turkey, developing custom platform enhancements.
          Managed production incidents at banking scale; mentored engineers and drove cross-team knowledge sharing.
        tech: [Python, Django, DRF, Celery, MongoDB, PostgreSQL, Redis, Data Modeling, Massive Query Optimization, Audit Data Pipelines, LangChain, LangGraph, ReAct Agents, Whisper, Ansible, Jenkins, GitLab CI, AWS, OpenStack, OpenShift, Kubernetes, Docker, Podman, Groovy, Infoblox, F5]


      - role: OpenStack Administrator & Developer
        time: 2015 - 2017
        company: Oesia, Madrid
        details: |
          Administered and maintained a private cloud infrastructure based on OpenStack and Ceph,
          ensuring availability, performance, and reliability of the platform for internal teams.
          Developed and integrated a private cloud storage application — similar in concept to Dropbox —
          built on top of OpenStack Swift object storage, providing users with secure, scalable file
          storage and sharing capabilities within the organisation's own infrastructure.
          Gained deep hands-on expertise in OpenStack internals, Ceph distributed storage, and the
          challenges of operating private cloud environments at production scale.
        details_short: |
          Administered a private cloud (OpenStack + Ceph) and built a self-hosted cloud storage app on OpenStack Swift.
        tech: [OpenStack, Ceph, Swift, Python, Linux]

          

