career-profile:
    title: Career Profile
    summary: |
        Senior Platform & Applied AI Systems Engineer with 10+ years of experience architecting high-scale
        internal platforms, distributed automation engines, and production-grade agentic workflows in Python.
        My core engineering philosophy centers on turning complex distributed infrastructure into invisible,
        self-service developer abstractions — building declarative orchestration engines, driver patterns, and
        deterministic AI systems that eliminate operational bottlenecks and enable engineering organizations to scale.

        As the sole architect and owner of BBVA’s central IaaS platform suite (Orion & Blueprint), I conceived and
        built the systems governing 30,000+ machines across AWS, OpenStack, OpenShift, and on-premises environments,
        processing 40,000+ daily operations for 500+ engineers. Designed the underlying data and query architecture
        (PostgreSQL, MongoDB, Redis) to support high-throughput operations, massive auditing exports, and strict
        regulatory compliance, while engineering custom asynchronous YAML engines that eliminated enterprise vendor
        lock-in (avoiding proprietary suites like Red Hat Automation Platform).

        At the intersection of platform engineering and applied AI, I pioneer reliable, agentic systems grounded in
        rigorous software engineering standards. Architected Orion AI (LangGraph/ReAct) to automate root-cause CI/CD
        diagnostics and slash MTTR from hours to seconds under strict deterministic guardrails, and design multimodal
        agentic pipelines leveraging LangGraph DAGs, Model Context Protocol (MCP), vector databases, and Whisper speech
        processing. Experienced in driving technical architecture across international engineering teams in Mexico and
        Turkey, establishing deployment standards, and mentoring engineers in platform and automation best practices.
    summary_short: |
        Senior Platform & Applied AI Systems Engineer with 10+ years of experience architecting internal developer
        platforms, distributed automation engines, and agentic workflows in Python. Sole architect of BBVA's central
        IaaS platform suite (Orion & Blueprint), managing 30,000+ machines and 40,000+ daily operations for 500+ engineers
        through clean, self-service abstractions and high-throughput data architectures.

        Pioneers production-grade operational AI, having architected the Orion AI agentic diagnostic engine
        (LangGraph/ReAct) and multimodal systems using Model Context Protocol (MCP), vector databases, and deterministic
        guardrails to turn complex infrastructure operations into autonomous, reliable workflows.





