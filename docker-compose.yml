services:
  jekyll:
    container_name: online-cv
    image: jekyll/jekyll:4.2.2
    command: jekyll serve --watch --force_polling --livereload --host 0.0.0.0
    volumes:
      - .:/srv/jekyll
      - jekyll_gems:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"

volumes:
  jekyll_gems:
