title: "About Me"

paragraphs:
  - "I am a Senior Software Engineer and Platform Architect with over 10 years of experience specialising
    in infrastructure automation, Python/Django development, and Site Reliability Engineering. Automation
    is not just something I implement — it is the lens through which I approach every engineering problem:
    if a human is doing it repeatedly, a system should be doing it instead."

  - "At BBVA, infrastructure deployments across 25,000+ machines in hybrid environments were fragmented,
    manual, and inconsistent — with no central visibility, no audit trail, and development teams entirely
    dependent on the infrastructure team to ship anything to production. I took full ownership as sole
    architect to solve this from the ground up. I conceived and built Orion: a centralised governance
    and deployment platform with full audit traceability, automated status reporting, permissions
    management, and a Swagger-documented REST API connecting with other core bank systems. Today Orion
    processes 35,000+ daily operations autonomously, serves 500+ engineers, and enables development
    teams to ship their own artefacts to production with zero infrastructure team intervention."

  - "Even with Orion in place, deployments across different infrastructure environments still required
    separate codebases and manual environment-specific configuration — a maintenance burden that only
    grew with scale. I designed a universal deployment pipeline based on a driver pattern: one codebase
    deployable to any environment by simply swapping the driver, backed by a centralised configuration
    management system that automatically resolves and injects the correct variables per environment at
    runtime. I extended this model to Kubernetes Jobs for containerised automation execution, and applied
    the same principles to the full Ansible codebase managing shared internal services including
    Artifactory and GitLab. Engineers now write once and deploy anywhere — with no manual variable
    management, no environment-specific branches, and full traceability at every step."

  - "When Jenkins became a critical bottleneck — unreliable at scale, hard to maintain, and locking
    the team into vendor constraints — I replaced it entirely without disrupting ongoing operations.
    I built a purpose-built dispatcher in Django and Celery, running in High Availability, with a full
    REST API for programmatic operation control, retry logic, and observability. Jenkins was fully
    decommissioned with zero downtime, and the team gained complete ownership over execution flow and
    a system built to evolve with their needs — not constrained by a third-party tool's limitations."

  - "Across all of these projects, my approach has been the same: understand the operational pain,
    design an automated solution that removes it permanently, and build it to last — with clean,
    test-driven code and decisions that stay aligned with business goals. But beyond the technical
    work, I care deeply about the people around me. I genuinely enjoy
    helping junior engineers and newcomers find their footing — making them feel part of the team from
    day one, answering every question with the same patience, and investing time in their growth because
    I know that a team where everyone feels capable and valued moves further than any individual ever
    could. Creating that environment is something I take as seriously as the code I write. I am also
    fully comfortable working remotely and across time zones — having collaborated daily with colleagues
    in Mexico and Turkey, I know that distance is never a barrier when communication and trust are built
    deliberately. I thrive where ownership, collaboration, and a culture of continuous learning are not
    just words — but the way the team actually works every day."
