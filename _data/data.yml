career-profile:
    title: Career Profile
    summary: |
        Senior Infrastructure & Platform Engineer with 10+ years of experience building automation-first
        internal platforms in Python — systems that eliminate manual processes, connect teams, and let
        organisations scale without adding headcount. I don't just build systems — I conceive, design,
        and own them end-to-end, from architecture decisions to production reliability.

        My work at BBVA has been defined by building internal platforms that shift how the organisation
        operates: replacing manual processes with automation, eliminating team bottlenecks by making underlying infrastructure effectively invisible to end users through self-service abstractions, generating audit data pipelines consumed by internal stakeholders, and
        bringing AI-driven operational intelligence to CI/CD infrastructure — such as **Orion AI**, an
        agentic auto-diagnostic system (LangGraph/ReAct) that reduces MTTR from hours to seconds.

        I believe in designing systems that are **simple to use but powerful underneath** — where infrastructure complexity is made completely invisible behind clean abstractions (like declarative YAML blueprints in our **automation suite**, agentic workflow graphs, driver patterns, agnostic pipelines) so that engineers across the organisation can move faster and with zero friction.

        Currently serving **500+ engineers** daily across a platform that processes **40,000+ operations/day**
        across **30,000+ machines**. Seeking Senior Platform Engineering, Infrastructure, SRE, or Systems Architect roles.
    summary_short: |
        Senior Infrastructure & Platform Engineer with 10+ years of experience in Python, DevOps, and
        automation. Owner and sole architect of BBVA's internal IaaS & operational AI platform suite (Orion, Orion AI & automation suite) — making underlying infrastructure completely invisible to **500+ engineers** daily across **30,000+ machines** and **40,000+ daily operations**.

        Specialised in building governance-driven self-service platforms, automated failure diagnostics, audit data pipelines, and environment-agnostic tooling. Seeking Senior Platform, Infrastructure, SRE, or Systems Integration roles.





