experiences:
    title: Experiences
    info:
      - role: Senior Python Developer, DevOps & SRE — IaaS Platform Owner
        time: 2017 - Present
        company: BBVA Technology, Madrid
        details: |
          Owner and sole architect of BBVA's internal IaaS platform suite — critical systems that today
          form the backbone of infrastructure operations across the entire organisation, serving 500+
          engineers and processing 35,000+ daily operations across 25,000+ machines.
          Led all technical decisions end-to-end: system architecture, API design, data modelling,
          async processing, deployment strategy, and long-term evolution of the platform.
          Defined a **deployment philosophy and engineering standards** adopted organisation-wide,
          establishing how infrastructure is provisioned, audited, and governed across all environments.
          Collaborated with multiple internal teams and stakeholders to identify operational bottlenecks
          and translate them into scalable, automated technical solutions.
          Managed production incidents and on-call responsibilities at banking scale, ensuring high
          availability and rapid resolution with minimal business impact.
          Mentored new team members and ran internal knowledge-sharing sessions across teams, fostering
          a common engineering culture around infrastructure automation and platform best practices.
          Worked in an international team alongside engineers in Mexico and Turkey.
        details_short: |
          Owner and sole architect of BBVA's IaaS platform suite (Orion), the backbone of infrastructure
          operations for the entire organisation — 25,000+ machines, 35,000+ daily operations, 500+ engineers.
          Led all technical decisions end-to-end: architecture, API design, deployment strategy, and platform evolution.
          Defined organisation-wide deployment philosophy and engineering standards across all environments and teams.
          Managed production incidents at banking scale; mentored engineers and drove knowledge sharing across teams.
        tech: [Python, Django, DRF, Celery, MongoDB, PostgreSQL, Ansible, Jenkins, GitLab CI, AWS, OpenStack, OpenShift, Kubernetes, Docker, Podman, Groovy, Infoblox, F5]

      - role: OpenStack Administrator & Developer
        time: 2015 - 2017
        company: Oesia, Madrid
        details: |
          Administered and maintained a private cloud infrastructure based on OpenStack and Ceph,
          ensuring availability, performance, and reliability of the platform for internal teams.
          Developed and integrated a private cloud storage application — similar in concept to Dropbox —
          built on top of OpenStack Swift object storage, providing users with secure, scalable file
          storage and sharing capabilities within the organisation's own infrastructure.
          Gained deep hands-on expertise in OpenStack internals, Ceph distributed storage, and the
          challenges of operating private cloud environments at production scale.
        details_short: |
          Administered a private cloud (OpenStack + Ceph) and built a self-hosted cloud storage app on OpenStack Swift.
        tech: [OpenStack, Ceph, Swift, Python, Linux]

          

